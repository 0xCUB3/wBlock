name: homebrew-cask

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish to, for example 2.0.4"
        required: true
        type: string

concurrency:
  group: homebrew-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin main

      - name: Run regression tests
        run: scripts/run-ci-tests.sh

      - name: Build iOS Simulator Release
        run: |
          set -o pipefail
          xcodebuild \
            -project wBlock.xcodeproj \
            -scheme wBlock \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  build-and-release:
    needs: verify
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Extract version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a stable version tag without a v prefix, for example 3.2.3." >&2
            exit 1
          fi
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12_B64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12_B64:-}" ]]; then
            echo "Missing secret: MACOS_CERT_P12_B64" >&2
            exit 1
          fi
          if [[ -z "${MACOS_CERT_PASSWORD:-}" ]]; then
            echo "Missing secret: MACOS_CERT_PASSWORD" >&2
            exit 1
          fi

          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "${MACOS_CERT_P12_B64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"

          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN_PATH}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

      - name: Install provisioning profile
        env:
          MACOS_PROFILE_APP_B64: ${{ secrets.MACOS_PROFILE_APP_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_PROFILE_APP_B64:-}" ]]; then
            echo "MACOS_PROFILE_APP_B64 not set, skipping profile install"
            exit 0
          fi
          PP_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "${PP_DIR}"
          echo "${MACOS_PROFILE_APP_B64}" | base64 --decode > "${PP_DIR}/wblock.provisionprofile"

      - name: Build DMG
        env:
          SIGNING_IDENTITY: "Developer ID Application: Alexander Skula (DNP7DGUB7B)"
          TEAM_ID: "DNP7DGUB7B"
          VERSION: ${{ env.VERSION }}
        run: |
          bash scripts/build-dmg.sh

      - name: Notarize + staple DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_API_KEY_ID:-}" ]]; then
            echo "Missing secret: APPLE_API_KEY_ID" >&2
            exit 1
          fi
          if [[ -z "${APPLE_API_ISSUER_ID:-}" ]]; then
            echo "Missing secret: APPLE_API_ISSUER_ID" >&2
            exit 1
          fi
          if [[ -z "${APPLE_API_KEY_P8_B64:-}" ]]; then
            echo "Missing secret: APPLE_API_KEY_P8_B64" >&2
            exit 1
          fi

          dmg="build/homebrew/wBlock-${VERSION}.dmg"
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "${APPLE_API_KEY_P8_B64}" | base64 --decode > "${key_path}"

          notary_output=$(xcrun notarytool submit "${dmg}" \
            --key "${key_path}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait 2>&1)
          echo "${notary_output}"

          uuid=$(echo "${notary_output}" | grep "  id:" | head -1 | awk '{print $2}')

          if echo "${notary_output}" | grep -q "status: Invalid"; then
            echo "Notarization failed. Fetching full log for UUID: ${uuid}"
            xcrun notarytool log "${uuid}" \
              --key "${key_path}" \
              --key-id "${APPLE_API_KEY_ID}" \
              --issuer "${APPLE_API_ISSUER_ID}"
            exit 1
          fi

          xcrun stapler staple "${dmg}"
          xcrun stapler validate "${dmg}"
          echo "Stapler validation passed"

      - name: Publish notarized DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dmg="build/homebrew/wBlock-${VERSION}.dmg"

          # Keep workflow-created releases private until the DMG is uploaded.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes ""
          fi

          is_prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          if [[ "$is_prerelease" == true ]]; then
            echo "Homebrew releases must not be prereleases." >&2
            exit 1
          fi

          # Published assets must keep the checksum reviewed by Homebrew.
          # An existing asset makes a rerun fail instead of replacing it.
          gh release upload "$TAG" "$dmg"
          is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [[ "$is_draft" == true ]]; then
            gh release edit "$TAG" --draft=false
          fi

          sha256=$(shasum -a 256 "$dmg" | awk '{print $1}')
          {
            echo "## Homebrew release"
            echo "Published wBlock ${VERSION}."
            echo "SHA-256: ${sha256}"
            echo "Homebrew autobump checks for updates every three hours. Merging and API publication may take longer."
            echo "https://github.com/Homebrew/homebrew-cask/blob/main/Casks/w/wblock.rb"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
