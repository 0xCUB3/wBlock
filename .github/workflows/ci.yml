name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DERIVED_DATA: ${{ github.workspace }}/.derived-data
  # Content-addressed compiler outputs survive the fresh mtimes of every
  # checkout, unlike Xcode's incremental build state. Only the cache and the
  # package checkouts are carried between runs.
  CACHED_BUILD_PATHS: |
    .derived-data/CompilationCache.noindex
    .derived-data/SourcePackages

jobs:
  checks:
    runs-on: xcode-27
    timeout-minutes: 5
    outputs:
      javascript: ${{ steps.plan.outputs.javascript }}
      native: ${{ steps.plan.outputs.native }}
      build: ${{ steps.plan.outputs.build }}
      sheet_ui: ${{ steps.plan.outputs.sheet_ui }}
      cache_month: ${{ steps.period.outputs.month }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select checks for the complete change
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_CI: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FULL_CI" == true || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            python3 scripts/ci_plan.py --full >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
            python3 scripts/ci_plan.py "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          fi

      - name: Check CI routing
        run: python3 -m unittest discover -s scripts -p test_ci_plan.py

      - name: Name the cache period
        id: period
        # Starting each month from an empty cache bounds its growth.
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

  javascript:
    needs: checks
    if: needs.checks.outputs.javascript == 'true'
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run JavaScript regressions
        run: bash scripts/run-ci-tests.sh --javascript

  tests:
    needs: checks
    if: needs.checks.outputs.native == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHED_BUILD_PATHS }}
          key: cas-core-${{ needs.checks.outputs.cache_month }}-${{ github.run_id }}
          restore-keys: cas-core-${{ needs.checks.outputs.cache_month }}-

      - name: Run native regressions
        env:
          WBLOCK_DERIVED_DATA: ${{ env.DERIVED_DATA }}
        run: scripts/run-ci-tests.sh --native

      - name: Save compilation cache
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHED_BUILD_PATHS }}
          key: cas-core-${{ needs.checks.outputs.cache_month }}-${{ github.run_id }}

  sheet-ui:
    needs: checks
    if: needs.checks.outputs.sheet_ui == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select available iPad simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          with open(sys.argv[1]) as source:
              runtimes = json.load(source)["devices"]
          versions = [(tuple(map(int, match.groups())), devices)
                      for runtime, devices in runtimes.items()
                      if (match := re.search(r"\.iOS-(\d+)-(\d+)", runtime))]
          matches = [device for version, devices in sorted(versions, key=lambda item: item[0], reverse=True)
                     if version >= (26, 0) for device in devices
                     if device.get("isAvailable") and device["name"].startswith("iPad")]
          if not matches:
              raise SystemExit("No available iOS 26+ iPad simulator for UI tests")
          print("udid=" + matches[0]["udid"])
          PY

      - name: Run fitted-sheet presentation
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: bash scripts/test_apply_sheet_presentation.sh "$SIMULATOR"

  build:
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: generic/platform=macOS
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
    name: build (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHED_BUILD_PATHS }}
          key: cas-release-${{ matrix.name }}-${{ needs.checks.outputs.cache_month }}-${{ github.run_id }}
          restore-keys: cas-release-${{ matrix.name }}-${{ needs.checks.outputs.cache_month }}-

      - name: Build Release
        run: |
          set -o pipefail
          # Release uploads still build both architectures; compile errors
          # show up in one.
          xcodebuild \
            -project wBlock.xcodeproj \
            -scheme wBlock \
            -configuration Release \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"
          # Swift 5 mode only warns when code uses an API newer than the
          # deployment target, and that code crashes on older systems.
          if grep -E 'warning: .*is only available in (iOS|macOS) ' "$RUNNER_TEMP/build.log" | sort -u | grep .; then
            echo "::error::Code needs a newer OS than the deployment target (see warnings above)."
            exit 1
          fi

      - name: Save compilation cache
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHED_BUILD_PATHS }}
          key: cas-release-${{ matrix.name }}-${{ needs.checks.outputs.cache_month }}-${{ github.run_id }}
