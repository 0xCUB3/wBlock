name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DERIVED_DATA: ${{ github.workspace }}/.derived-data

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.plan.outputs.native }}
      build: ${{ steps.plan.outputs.build }}
      rules_ui: ${{ steps.plan.outputs.rules_ui }}
      sheet_ui: ${{ steps.plan.outputs.sheet_ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select checks for the complete change
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_CI: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FULL_CI" == true || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            python3 scripts/ci_plan.py --full >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
            python3 scripts/ci_plan.py "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          fi

      - name: Check CI routing
        run: python3 -m unittest discover -s scripts -p test_ci_plan.py

      - name: Run JavaScript regressions
        if: steps.plan.outputs.javascript == 'true'
        run: bash scripts/run-ci-tests.sh --javascript

  tests:
    needs: checks
    if: needs.checks.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin main

      - name: Restore core build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived-data
          key: core-debug-${{ runner.os }}-${{ hashFiles('wBlock.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'wBlockCoreService/**', 'wBlock.xcodeproj/project.pbxproj') }}
          restore-keys: |
            core-debug-${{ runner.os }}-

      - name: Run native regressions
        env:
          WBLOCK_DERIVED_DATA: ${{ env.DERIVED_DATA }}
        run: scripts/run-ci-tests.sh --native

  rules-viewer-ui:
    needs: checks
    if: needs.checks.outputs.rules_ui == 'true' || needs.checks.outputs.sheet_ui == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        if: needs.checks.outputs.rules_ui == 'true'
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Select available iPad simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          with open(sys.argv[1]) as source:
              runtimes = json.load(source)["devices"]
          versions = [(tuple(map(int, match.groups())), devices)
                      for runtime, devices in runtimes.items()
                      if (match := re.search(r"\.iOS-(\d+)-(\d+)", runtime))]
          matches = [device for version, devices in sorted(versions, key=lambda item: item[0], reverse=True)
                     if version >= (26, 0) for device in devices
                     if device.get("isAvailable") and device["name"].startswith("iPad")]
          if not matches:
              raise SystemExit("No available iOS 26+ iPad simulator for UI tests")
          print("udid=" + matches[0]["udid"])
          PY

      - name: Run rules-viewer gestures
        if: needs.checks.outputs.rules_ui == 'true'
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: bash scripts/test_rules_viewer_ui.sh "$SIMULATOR"

      - name: Run fitted-sheet presentation
        if: needs.checks.outputs.sheet_ui == 'true'
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: bash scripts/test_apply_sheet_presentation.sh "$SIMULATOR"

      - name: Preserve gesture-test diagnostics on failure
        if: failure() && needs.checks.outputs.rules_ui == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rules-viewer-results
          path: ~/Library/Developer/Xcode/DerivedData/ScrollProbe-*/Logs/Test/*.xcresult
          retention-days: 3

  build:
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: generic/platform=macOS
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
    name: build (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived-data
          key: app-release-${{ matrix.name }}-${{ hashFiles('wBlock.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'wBlock.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            app-release-${{ matrix.name }}-${{ hashFiles('wBlock.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'wBlock.xcodeproj/project.pbxproj') }}-
            app-release-${{ matrix.name }}-

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project wBlock.xcodeproj \
            -scheme wBlock \
            -configuration Release \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
