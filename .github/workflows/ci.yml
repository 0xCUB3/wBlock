name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run regression tests
        run: scripts/run-ci-tests.sh

      - name: Build macOS Release
        run: |
          set -o pipefail
          xcodebuild \
            -project wBlock.xcodeproj \
            -scheme wBlock \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS Simulator Release
        run: |
          set -o pipefail
          xcodebuild \
            -project wBlock.xcodeproj \
            -scheme wBlock \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
