[package]
name = "wbe"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = { version = "2", features = ["serde"] }
memchr = "2"
idna = "1"
rustc-hash = "2"
cssparser = "0.35"
selectors = "0.32"
precomputed-hash = "0.1"

[features]
default = []
wasm = []
