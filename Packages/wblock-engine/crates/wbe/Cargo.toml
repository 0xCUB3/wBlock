[package]
name = "wbe"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = { version = "2", features = ["serde"] }
memchr = "2"
memmap2 = "0.9"
regex = "1"
idna = "1"
rustc-hash = "2"
cssparser = "0.35"
selectors = "0.32"
precomputed-hash = "0.1"
# Public suffix list, for registrable domains and entity (`name.*`) keys.
addr = { version = "0.15", default-features = false, features = ["psl"] }

[features]
default = []
wasm = []
