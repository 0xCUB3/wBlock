[package]
name = "wbe"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = { version = "2", features = ["serde"] }
memchr = "2"
idna = "1"
rustc-hash = "2"
cssparser = "0.35"
selectors = "0.32"
precomputed-hash = "0.1"
# Cosmetic, procedural, and scriptlet matching only; network rules are compiled
# to Safari JSON, so the adblock-rust network features are off. css-validation
# is required: without it `:has-text(...)` is treated as a plain CSS selector.
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "single-thread", "css-validation"] }

[features]
default = []
wasm = []
