[workspace]
resolver = "2"
members = ["crates/wbe"]

[profile.release]
# ThinLTO keeps cross-crate inlining while parallelizing codegen/LTO across
# cores (much faster on Xcode Cloud and CI than single-threaded fat LTO).
lto = "thin"
# ffi.rs catches panics at the C boundary, which needs unwinding.
panic = "unwind"
opt-level = 3
