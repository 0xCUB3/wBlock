<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A document base makes the external API hints look like valid absolute
     media candidates while the actual media elements remain source-less. -->
<base href="https://example.com/embed/">
<title>Source-less player API hints (Player Cleaner test)</title>
<style>
  body { margin: 0; background: #111; }
  .player { position: relative; width: 320px; aspect-ratio: 16 / 9; margin: 12px auto; background: #000; }
  .player video { width: 100%; height: 100%; background: #222; }
</style>
</head>
<body>
  <!-- Both wrappers expose direct-looking hints before their <video> owns a
       source. Player Cleaner must preserve this setup DOM and wait. -->
  <div class="jwplayer player" id="rel-jw"><video></video><div class="setup-sentinel"></div></div>

  <div class="flowplayer player" id="rel-dom"><video></video><div class="setup-sentinel" data-src="/media/dom.mp4"></div></div>

  <script>
    (function () {
      // Keep the media elements source-less while the external hints exist.
      ['rel-jw', 'rel-dom'].forEach(function (id) {
        var v = document.getElementById(id).querySelector('video');
        try { v.removeAttribute('src'); } catch (e) {}
      });

      // The API can be available before JW Player attaches its real source.
      window.jwplayer = function (idOrEl) {
        var id = typeof idOrEl === 'string' ? idOrEl : (idOrEl && idOrEl.id);
        if (id !== 'rel-jw') return null;
        return { getPlaylistItem: function () { return { file: '/download/item/movie.mp4' }; } };
      };
    })();
  </script>
</body>
</html>
