<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JW Player cached initialization race (Player Cleaner test)</title>
<style>
  body { margin: 0; background: #111; }
  .jwplayer { position: relative; width: 640px; aspect-ratio: 16 / 9; background: #000; }
  video { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="jwplayer" id="cached-jw-player">
    <video></video>
    <div class="jw-core-controls" data-setup-mount></div>
  </div>

  <script>
    (function () {
      // On a warm load the API may be available before JW Player has attached
      // its MSE source or finished building controls.
      window.jwplayer = function (id) {
        if (id !== 'cached-jw-player') return null;
        return { getPlaylistItem: function () {
          return { file: 'https://example.com/fallback.mp4' };
        } };
      };

      window.__jwInitRace = { finished: false, error: '' };
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          try {
            var container = document.getElementById('cached-jw-player');
            var mount = container.querySelector('[data-setup-mount]');
            // Mirrors the failing JW controls path: cached setup expects its
            // mount node to survive until it can append the controls tree.
            var controls = document.createElement('div');
            controls.setAttribute('data-jw-controls-ready', '');
            mount.appendChild(controls);

            var video = container.querySelector('video');
            video.src = 'blob:https://example.com/00000000-0000-0000-0000-000000000000';
            window.__jwInitRace.finished = true;
          } catch (error) {
            window.__jwInitRace.error = String(error);
          }
        }, 0);
      });
    })();
  </script>
</body>
</html>
