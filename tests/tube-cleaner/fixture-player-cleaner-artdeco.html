<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic unknown player with positioned chrome (Player Cleaner generic test)</title>
<style>
  body { margin: 0; background: #111; }
  /* Completely unknown class names — Player Cleaner has never seen these.
     The container uses position:relative (a positioning context), which is
     the heuristic that tells the generic chrome hider this is a player shell. */
  .xq7-player-shell {
    position: relative; width: 960px; max-width: 100%;
    aspect-ratio: 16 / 9; margin: 24px auto; background: #000;
  }
  .xq7-player-shell video { width: 100%; height: 100%; background: #222; }
  /* Intermediate static wrapper around the video, the way Vimeo/LinkedIn nest
     the media element. The overlay chrome below is a sibling of this frame,
     not of the video, so hiding relative to video.parentElement misses it. */
  .xq7-video-frame { width: 100%; height: 100%; }
  .xq7-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center;
  }
  .xq7-controls-wrap {
    position: absolute; left: 0; right: 0; bottom: 0;
  }
  .xq7-controls-bar {
    height: 48px; background: rgba(0,0,0,.75);
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
    color: #fff; font: 13px/1 sans-serif;
  }
  /* LinkedIn-style nesting: the <video> sits in an INNER positioned wrapper, but
     the control bar is pinned to the OUTER shell as a sibling of that wrapper.
     The nearest positioned ancestor of the video is the inner wrapper, so a
     container-descendant sweep stops there and never sees the bar. Only an
     overlap climb to the outer shell (plus a reactive re-hide when the player
     remounts the bar) catches it. */
  .xq7-nested { position: relative; width: 960px; max-width: 100%; aspect-ratio: 16 / 9; margin: 24px auto; background: #000; }
  .xq7-nested .xq7-inner { position: relative; width: 100%; height: 100%; }
  .xq7-nested video { width: 100%; height: 100%; background: #222; display: block; }
  .xq7-late-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    background: rgba(0,0,0,.75); display: flex; align-items: center; padding: 0 12px;
    color: #fff; font: 13px/1 sans-serif;
  }
  /* Design-system style: !important display that beats plain style.display = 'none'.
     LinkedIn (and many design systems) reassert visibility this way. */
  .xq7-important-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
    background: rgba(40,0,0,.85); display: flex !important; align-items: center;
    padding: 0 12px; color: #fff; font: 13px/1 sans-serif;
  }
  /* Portal-style fixed chrome outside the player shell. An ancestor climb never
     sees it; only elementsFromPoint hit-testing does. */
  .xq7-portal {
    position: fixed; z-index: 50; height: 40px;
    background: rgba(0,40,0,.9); display: flex !important; align-items: center;
    padding: 0 12px; color: #fff; font: 13px/1 sans-serif; pointer-events: auto;
  }
  /* LinkedIn end-card: a STATIC flex box the same size as the video, painted as a
     grid sibling over the media. pe:auto steals every hit from native controls.
     Absolute/fixed-only hide never touches it. */
  .xq7-cover-shell {
    display: grid; width: 960px; max-width: 100%; aspect-ratio: 16 / 9;
    margin: 24px auto; background: #000; position: relative;
  }
  .xq7-cover-shell > * { grid-area: 1 / 1; }
  .xq7-cover-shell video { width: 100%; height: 100%; background: #222; display: block; }
  .xq7-static-cover {
    position: static; display: flex; align-items: center; justify-content: center;
    gap: 12px; background: rgba(0,0,0,.75); color: #fff; font: 14px/1 sans-serif;
    pointer-events: auto; width: 100%; height: 100%;
  }
  /* LinkedIn-style STATIC control bar: a short flex strip (NOT full-bleed, NOT
     positioned) stacked over the video's bottom in a grid. pe:auto steals hits
     from native controls. Too short for the cover heuristic, not positioned,
     so only a control-bar detector catches it. */
  .xq7-bar-shell {
    display: grid; width: 960px; max-width: 100%; aspect-ratio: 16 / 9;
    margin: 24px auto; background: #000; position: relative;
  }
  .xq7-bar-shell > * { grid-area: 1 / 1; }
  .xq7-bar-shell video { width: 100%; height: 100%; background: #222; display: block; }
  .xq7-static-bar {
    position: static; align-self: end; height: 48px; width: 100%;
    background: rgba(0,0,0,.75); display: flex; align-items: center; gap: 8px;
    padding: 0 12px; color: #fff; font: 13px/1 sans-serif; pointer-events: auto;
  }
</style>
</head>
<body>
  <!-- Keep the portal player near the top so it stays in the test viewport;
       elementsFromPoint only resolves in-view coordinates. -->
  <div class="xq7-nested" id="xq7-portal-player" style="position:relative; margin-top: 0;">
    <div class="xq7-inner">
      <video id="xq7-portal-video"></video>
    </div>
  </div>
  <!-- Mounted on body, not inside the shell — portal / fixed chrome. -->
  <div class="xq7-portal" id="xq7-portal-bar"><span>portal bar</span></div>

  <div class="xq7-cover-shell" id="xq7-cover-shell">
    <video id="xq7-cover-video"></video>
    <div class="xq7-static-cover" id="xq7-static-cover">
      <button type="button">Repost</button>
      <button type="button">Watch again</button>
    </div>
  </div>

  <div class="xq7-bar-shell" id="xq7-bar-shell">
    <video id="xq7-bar-video"></video>
    <div class="xq7-static-bar" id="xq7-static-bar">
      <input type="range" style="flex:1">
      <button type="button">▶</button>
      <button type="button">🔊</button>
      <button type="button">⛶</button>
    </div>
  </div>

  <!-- A player whose wrapper class is NOT in Player Cleaner's known-library
       list.  The container has position:relative, so the generic chrome hider
       treats it as a player shell and aggressively hides all non-video chrome. -->
  <div class="xq7-player-shell xq7-player-shell--active">
    <div class="xq7-video-frame">
      <video></video>
    </div>
    <div class="xq7-overlay">
      <span class="xq7-play-btn">▶</span>
    </div>
    <div class="xq7-controls-wrap">
      <div class="xq7-controls-bar">
        <span class="xq7-play-btn">⏸</span>
        <span class="xq7-time">0:00</span>
        <div class="xq7-progress"></div>
        <span class="xq7-mute-btn">🔊</span>
        <span class="xq7-cc-btn">CC</span>
        <span class="xq7-fs-btn">⛶</span>
      </div>
    </div>
  </div>

  <div class="xq7-nested" id="xq7-nested">
    <div class="xq7-inner">
      <video></video>
    </div>
    <div class="xq7-late-bar"><span class="xq7-ln-time">0:00</span></div>
    <div class="xq7-important-bar" id="xq7-important"><span>!important bar</span></div>
  </div>

  <script>
    (function () {
      var v = document.querySelector('.xq7-player-shell video');
      // Opaque MSE-style source so Player Cleaner enhances in place.
      try { v.src = 'blob:https://example.com/00000000-0000-0000-0000-000000000000'; } catch (e) {}

      // Adversarial: the custom player keeps trying to hide native controls.
      function fightControls() {
        try { v.controls = false; } catch (e) {}
        try { v.removeAttribute('controls'); } catch (e) {}
      }
      setTimeout(fightControls, 800);
      setTimeout(fightControls, 2500);
      setInterval(fightControls, 3000);

      // Simulate video.js / Vimeo click-to-toggle on the shell: a click on the
      // video would otherwise bubble here and double-toggle play/pause, fighting
      // the native control. Player Cleaner must stop the click from bubbling.
      window.__shellToggleCount = 0;
      document.querySelector('.xq7-player-shell').addEventListener('click', function () {
        window.__shellToggleCount++;
        try { v[v.paused ? 'play' : 'pause'](); } catch (e) {}
      });

      // Nested (LinkedIn-style) player: inner positioned wrapper + outer shell
      // bar. After the cleaner's one-shot hide, simulate a React remount on play
      // by replacing the bar node with a fresh one — the reactive re-hide must
      // catch it again.
      var v2 = document.querySelector('#xq7-nested video');
      try { v2.src = 'blob:https://example.com/11111111-1111-1111-1111-111111111111'; } catch (e) {}
      function fightControls2() {
        try { v2.controls = false; } catch (e) {}
        try { v2.removeAttribute('controls'); } catch (e) {}
      }
      setTimeout(fightControls2, 900);
      setInterval(fightControls2, 3000);
      setTimeout(function () {
        var shell = document.getElementById('xq7-nested');
        var old = shell.querySelector('.xq7-late-bar');
        if (old) { old.parentNode.removeChild(old); }
        var bar = document.createElement('div');
        bar.className = 'xq7-late-bar';
        bar.innerHTML = '<span class="xq7-ln-time">0:00</span>';
        shell.appendChild(bar);
      }, 1800);

      // Portal player: pin a fixed bar over the video from outside the shell.
      var v3 = document.getElementById('xq7-portal-video');
      try { v3.src = 'blob:https://example.com/22222222-2222-2222-2222-222222222222'; } catch (e) {}
      function placePortal() {
        var r = v3.getBoundingClientRect();
        var bar = document.getElementById('xq7-portal-bar');
        if (!bar || !r.width) return;
        bar.style.left = r.left + 'px';
        bar.style.width = r.width + 'px';
        bar.style.top = (r.bottom - 40) + 'px';
      }
      placePortal();
      setTimeout(placePortal, 50);
      setTimeout(placePortal, 400);
      // Late portal remount after play (LinkedIn-style).
      setTimeout(function () {
        var old = document.getElementById('xq7-portal-bar');
        if (old) { old.parentNode.removeChild(old); }
        var bar = document.createElement('div');
        bar.className = 'xq7-portal';
        bar.id = 'xq7-portal-bar';
        bar.innerHTML = '<span>portal bar remount</span>';
        document.body.appendChild(bar);
        placePortal();
        try { v3.dispatchEvent(new Event('play')); } catch (e) {}
      }, 2000);

      var v4 = document.getElementById('xq7-cover-video');
      try { v4.src = 'blob:https://example.com/33333333-3333-3333-3333-333333333333'; } catch (e) {}
      // Late remount of the static cover after "ended" (LinkedIn watch-again card).
      setTimeout(function () {
        var shell = document.getElementById('xq7-cover-shell');
        var old = document.getElementById('xq7-static-cover');
        if (old) { old.parentNode.removeChild(old); }
        var cover = document.createElement('div');
        cover.className = 'xq7-static-cover';
        cover.id = 'xq7-static-cover';
        cover.innerHTML = '<button type="button">Repost</button><button type="button">Watch again</button>';
        shell.appendChild(cover);
        try { v4.dispatchEvent(new Event('pause')); } catch (e) {}
      }, 2100);

      var v5 = document.getElementById('xq7-bar-video');
      try { v5.src = 'blob:https://example.com/44444444-4444-4444-4444-444444444444'; } catch (e) {}
      // Late remount of the static control bar after "play" (LinkedIn control bar).
      setTimeout(function () {
        var shell = document.getElementById('xq7-bar-shell');
        var old = document.getElementById('xq7-static-bar');
        if (old) { old.parentNode.removeChild(old); }
        var bar = document.createElement('div');
        bar.className = 'xq7-static-bar';
        bar.id = 'xq7-static-bar';
        bar.innerHTML = '<input type="range" style="flex:1"><button type="button">▶</button><button type="button">🔊</button><button type="button">⛶</button>';
        shell.appendChild(bar);
        try { v5.dispatchEvent(new Event('play')); } catch (e) {}
      }, 2200);
    })();
  </script>
</body>
</html>
